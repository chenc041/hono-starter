name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hono_starter

      - name: Lint and typecheck
        run: bun run check

      - name: Test
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Publish coverage summary
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          awk -F: '
            /^LF:/ { lf += substr($0, 4) }
            /^LH:/ { lh += substr($0, 4) }
            /^FNF:/ { fnf += substr($0, 5) }
            /^FNH:/ { fnh += substr($0, 5) }
            END {
              line_pct = lf ? (lh * 100 / lf) : 100
              func_pct = fnf ? (fnh * 100 / fnf) : 100
              print "## Coverage"
              print ""
              print "| Metric | Covered | Total | Percentage |"
              print "|---|---:|---:|---:|"
              printf "| Lines | %d | %d | %.2f%% |\n", lh, lf, line_pct
              printf "| Functions | %d | %d | %.2f%% |\n", fnh, fnf, func_pct
            }
          ' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
